name: Deploy Frontend

# Rebuilds & restarts ONLY the frontend (pay.lanari.rw) on the Contabo server,
# and only when frontend code (or the compose file) changes. Backend pushes are
# handled by deploy-backend.yml. The server .env is bootstrapped once and reused.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server.ts'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'Dockerfile'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

# Serialise with the backend workflow so concurrent rsyncs never race.
concurrency:
  group: smartpay-deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: 176.126.87.142
  DEPLOY_USER: root
  DEPLOY_PATH: /opt/smartpay-gateway
  SERVICE: frontend

jobs:
  deploy:
    name: Build & deploy frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        # DEPLOY_SSH_KEY may be base64-encoded (preferred) or a raw PEM key.
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key 2>/dev/null || true
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync repo to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude "dist" \
            --exclude ".env" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Rebuild frontend & smoke-test
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' SERVICE='$SERVICE' bash -s" <<'EOSSH'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # Bootstrap the server .env once — secrets generated, never overwritten.
          if [ ! -f .env ]; then
            {
              echo "POSTGRES_USER=smartpay"
              echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
              echo "POSTGRES_DB=smartpay"
              echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)"
              echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
              echo "CORS_ORIGIN=https://pay.lanari.rw"
              echo "VITE_API_BASE_URL=https://api-pay.lanari.rw/api"
              echo "WEB_PORT=3000"
              echo "API_PORT=4000"
            } > .env
            echo "[deploy] created .env"
          fi

          docker compose -f docker-compose.prod.yml up -d --build "$SERVICE"
          docker image prune -f

          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1 && { echo "Frontend healthy"; break; }
            echo "waiting for frontend... ($i)"; sleep 3
          done
          echo "Frontend deployed"
          EOSSH
