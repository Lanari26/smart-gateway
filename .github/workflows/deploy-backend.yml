name: Deploy Backend

# Rebuilds & restarts ONLY the backend (api-pay.lanari.rw) on the Contabo
# server, and only when backend code (or the compose file) changes. Frontend
# pushes are handled by deploy-frontend.yml. The server .env is bootstrapped
# once (secrets generated) and never overwritten.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# Serialise with the frontend workflow so concurrent rsyncs never race.
concurrency:
  group: smartpay-deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: 176.126.87.142
  DEPLOY_USER: root
  DEPLOY_PATH: /opt/smartpay-gateway
  SERVICE: backend

jobs:
  deploy:
    name: Build & deploy backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        # DEPLOY_SSH_KEY may be base64-encoded (preferred) or a raw PEM key.
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key 2>/dev/null || true
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync repo to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude "dist" \
            --exclude ".env" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Rebuild backend & smoke-test the API
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' SERVICE='$SERVICE' bash -s" <<'EOSSH'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # Bootstrap the server .env once — secrets generated, never overwritten.
          if [ ! -f .env ]; then
            {
              echo "POSTGRES_USER=smartpay"
              echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
              echo "POSTGRES_DB=smartpay"
              echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)"
              echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
              echo "CORS_ORIGIN=https://pay.lanari.rw"
              echo "VITE_API_BASE_URL=https://api-pay.lanari.rw/api"
              echo "WEB_PORT=3000"
              echo "API_PORT=4000"
            } > .env
            echo "[deploy] created .env"
          fi

          docker compose -f docker-compose.prod.yml up -d --build "$SERVICE"
          docker image prune -f

          API=http://127.0.0.1:4000
          healthy=0
          for i in $(seq 1 40); do
            curl -fsS "$API/api/health" >/dev/null 2>&1 && { echo "API healthy"; healthy=1; break; }
            echo "waiting for API... ($i)"; sleep 3
          done
          if [ "$healthy" != "1" ]; then
            echo "::error::API never became healthy — dumping backend container logs:"
            docker compose -f docker-compose.prod.yml logs --tail=150 backend || true
            exit 1
          fi

          # Smoke test: login as the seeded admin, then hit every resource.
          TOKEN=$(curl -fsS -X POST "$API/api/auth/login" -H 'Content-Type: application/json' \
            -d '{"identifier":"lanari.rw@gmail.com","password":"lanari@123!"}' \
            | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p')
          [ -n "$TOKEN" ] || { echo "login failed"; exit 1; }
          for ep in transactions plans subscriptions api-keys whitelist invoices dashboard; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$API/api/$ep" -H "Authorization: Bearer $TOKEN")
            echo "  GET /api/$ep -> $code"
            [ "$code" = "200" ] || { echo "FAILED: /api/$ep returned $code"; exit 1; }
          done
          echo "All API endpoints OK"

          # ── Live payment-gateway checks (real ITECpay calls) ──────────────
          echo "Live payment checks:"

          # Mint a SECRET API key (attributed to the logged-in merchant); the
          # payment endpoints require it so charges are always attributable.
          APIKEY=$(curl -fsS -X POST "$API/api/api-keys" -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"label":"CI Live Test","type":"SECRET","mode":"test"}' \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          [ -n "$APIKEY" ] || { echo "FAILED: could not create API key"; exit 1; }
          echo "  minted API key ${APIKEY%%_*}_…"

          # 1) No API key -> 401 (auth runs before validation).
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$API/api/payments/momo" \
            -H 'Content-Type: application/json' \
            -d '{"customerName":"x","customerEmail":"x@x.rw","phone":"0788000000","amount":100}')
          echo "  POST /api/payments/momo (no key) -> $code"
          [ "$code" = "401" ] || { echo "FAILED: expected 401"; exit 1; }

          # 2) Valid key, malformed body -> 400.
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$API/api/payments/momo" \
            -H 'Content-Type: application/json' -H "X-API-Key: $APIKEY" \
            -d '{"customerName":"x","customerEmail":"bad","phone":"123","amount":0}')
          echo "  POST /api/payments/momo (invalid body) -> $code"
          [ "$code" = "400" ] || { echo "FAILED: expected 400"; exit 1; }

          # 3) Status of an unknown reference is a clean 404.
          code=$(curl -s -o /dev/null -w "%{http_code}" "$API/api/payments/tx_does_not_exist/status")
          echo "  GET /api/payments/tx_does_not_exist/status -> $code"
          [ "$code" = "404" ] || { echo "FAILED: expected 404"; exit 1; }

          # 4) Live ITECpay card-link generation, attributed to the key's
          #    merchant. Hits the real gateway end to end (request body + key +
          #    response parsing); no money moves until the link is actually paid.
          resp=$(curl -fsS -X POST "$API/api/payments/card" -H 'Content-Type: application/json' \
            -H "X-API-Key: $APIKEY" \
            -d '{"customerName":"CI Live Test","email":"ci@smartpay.rw","amount":100}')
          echo "  POST /api/payments/card -> $resp"
          echo "$resp" | grep -q '"link"' || { echo "FAILED: card link not generated (live ITECpay)"; exit 1; }
          echo "Live payment checks OK"
          EOSSH
